name: Python runtime integration tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/coe-marble/rpp-test-container:lyrical-ubuntu26.04-capnp1.1.0-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.RPP_CI_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      ROS_DISTRO: lyrical
    steps:
      - name: Check out repository under test
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Check out RPP integration dependencies
        uses: actions/checkout@v4
        with:
          repository: coe-marble/rpp_dev
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          path: rpp_dev
          submodules: recursive
          token: ${{ secrets.RPP_CI_TOKEN || github.token }}
      - name: Overlay the repository under test
        run: rsync -a --delete --exclude=.git candidate/ rpp_dev/src/rpp_py/
      - name: Install local RPP packages
        run: |
          for package in rpp_dev/src/rpp_common rpp_dev/src/rpp_plugin_registrator rpp_dev/src/rpp_orchestrator rpp_dev/src/rpp_py rpp_dev/src/rpp_cli rpp_dev/src/rpp_testing; do
            python -m pip install --no-deps -e "$package"
          done
          python -m pip install -e "rpp_dev/src/rpp_py[test]"
      - name: Build the C++ runtime
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --base-paths rpp_dev/src/rpp_cpp --symlink-install --cmake-args -DBUILD_TESTING=OFF -DPython3_EXECUTABLE=/opt/rpp-test-venv/bin/python
          rpp registry config set RPP_CPP_CORE_PATH "$PWD/build/rpp_cpp"
      - name: Run tests
        run: python -m pytest rpp_dev/src/rpp_py/tests
